services:
  # ── Observability (OpenTelemetry) ────────────────────────────────────────
  # The api-node and compute-node export OTLP traces to this collector, which
  # forwards them to Jaeger for inspection. Distributed tracing spans the
  # HTTP request, the RabbitMQ publish/consume, and the Redis job writes.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: frees-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    # Loopback-only. Every service that exports traces reaches the collector
    # over the compose network by name (otel-collector:4317); this host mapping
    # exists solely so you can point a local tool at it. Published on 0.0.0.0 it
    # would let anyone on the LAN inject arbitrary spans.
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: frees-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    # Loopback-only: the Jaeger UI has NO authentication, and every trace it
    # holds carries request URIs — including /api/repl/variables?sessionId=...,
    # which is the only thing protecting a user's solved workspace — plus the
    # full internal service topology.
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI

  redis:
    image: redis:7-alpine
    container_name: frees-redis
    # Loopback-only: no password is configured, so the only thing keeping a LAN
    # neighbour out of the job store and REPL session cache is Redis's
    # protected-mode default — which silently stops applying the moment a
    # password or a bind directive is added. The app reaches Redis over the
    # compose network, so nothing needs this published.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: frees-rabbitmq
    # Loopback-only: the management UI on 15672 is a login page for a broker
    # still using the default guest credentials (remote guest login is refused
    # by RabbitMQ's loopback-user default, but there is no reason to offer the
    # surface), and 5672 is the task queue itself.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-node:
    build: ./backend
    container_name: frees-api-node
    environment:
      - SPRING_PROFILES_ACTIVE=api
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
      # asammdf sidecar: covers DZ-compressed .mf4 files the in-process
      # parser cannot read (fallback ladder rung 3, todo.md decision 4).
      - FREES_MEASUREMENTS_SIDECAR_URL=http://mdf-sidecar:8090
      # OpenTelemetry: export traces to the OTel collector service below.
      - OTEL_SERVICE_NAME=api-node
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    # Bind the API to the loopback interface only: local dev can still reach
    # http://localhost:8080/api, but remote/LAN hosts cannot hit the backend
    # directly — they must go through the rate-limited nginx proxy.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  compute-node:
    build: ./backend
    deploy:
      replicas: 3
    environment:
      - SPRING_PROFILES_ACTIVE=compute
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
      # Headless: the compute node only consumes from RabbitMQ and writes
      # results to Redis — it serves no HTTP, so it starts no web server.
      # The integration test runs both profiles in one JVM (needs MockMvc) and
      # does not set this var, so it keeps the web server.
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      # OpenTelemetry: export traces to the OTel collector service below.
      - OTEL_SERVICE_NAME=compute-node
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  mdf-sidecar:
    build: ./mdf-sidecar
    container_name: frees-mdf-sidecar
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_COMMIT_HASH: ${VITE_COMMIT_HASH:-}
        # The api-node runs the `api` profile (202 + job polling), so the
        # frontend must use the async submit→poll path to match.
        VITE_ASYNC_API: "1"
    environment:
      BUILD_COMMIT: ${VITE_COMMIT_HASH:-}
      BACKEND_HOST: api-node
      # Which upstream hops may set X-Forwarded-For (see
      # docker-entrypoint.d/10-real-ip.sh). Empty by default: with a
      # docker-published port the peer is always the bridge gateway, so
      # trusting it would let any client forge its own address. Set this ONLY
      # to the address an edge proxy actually reaches nginx from — e.g.
      # "fd00::/8" on Railway, or the tunnel's range for Pangolin.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    container_name: frees-frontend
    # The ONLY port meant to carry traffic — and the only one whose bind address
    # is configurable, because the right answer differs per deployment. Defaults
    # to loopback (a personal machine, where http://localhost:5173 is all you
    # need). A homelab fronted by a tunnel whose agent runs off-host needs it
    # reachable: set FREES_FRONTEND_BIND=0.0.0.0 — but only once the tunnel, not
    # the LAN, is what reaches it.
    ports:
      - "${FREES_FRONTEND_BIND:-127.0.0.1}:5173:8080"
    depends_on:
      api-node:
        condition: service_healthy
