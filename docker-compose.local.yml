# frees — run the published images locally.
#
# This file is what install.sh downloads, and it is deliberately SELF-CONTAINED:
# every service pulls a published image and nothing is bind-mounted, so running
# frees needs exactly this one file and no checkout. Keep it that way — adding a
# `build:` or a `volumes:` entry that points at a repo path silently breaks the
# one-line installer for everyone who has no clone.
#
# Difference from docker-compose.prod.yml: no otel-collector and no Jaeger.
# Those exist to debug a deployment, need a mounted collector config (the thing
# that would make this multi-file), and would put an UNAUTHENTICATED Jaeger UI —
# whose traces carry request URIs including session ids — on an end user's
# machine. Tracing is switched off at the SDK rather than left pointing at a
# collector that isn't there.
#
# Pin a version with FREES_VERSION (any tag CI publishes — `latest` or a commit
# sha), e.g.  FREES_VERSION=c929684 docker compose -f docker-compose.local.yml up -d
#
# Every port is bound to loopback. The frontend's bind address is the one knob:
# FREES_FRONTEND_BIND=0.0.0.0 exposes it beyond this machine — only do that when
# something you trust (a tunnel agent), not the open LAN, is what reaches it.

services:
  redis:
    image: redis:7-alpine
    container_name: frees-redis
    restart: unless-stopped
    # Loopback-only: no password is configured, so Redis's protected-mode
    # default is the only thing keeping a LAN neighbour out of the job store
    # and the REPL session cache.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: frees-rabbitmq
    restart: unless-stopped
    # Loopback-only: default guest credentials on the management UI (15672),
    # and the task queue itself on 5672.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-node:
    image: ghcr.io/ernsoylu/frees-backend:${FREES_VERSION:-latest}
    container_name: frees-api-node
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=api
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
      # asammdf sidecar: reads the DZ-compressed .mf4 files the in-process
      # parser cannot. Without this var the analyzer's fallback ladder loses
      # its last rung and those files fail to load.
      - FREES_MEASUREMENTS_SIDECAR_URL=http://mdf-sidecar:8090
      # No collector is running here, so disable the SDK outright rather than
      # leaving it retrying an endpoint that will never answer.
      - OTEL_SDK_DISABLED=true
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    # Loopback-only: LAN hosts must go through the rate-limited nginx proxy
    # rather than hitting the API directly.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  compute-node:
    image: ghcr.io/ernsoylu/frees-backend:${FREES_VERSION:-latest}
    deploy:
      replicas: 3
    # A solve that exhausts the JVM heap kills the worker; without a restart
    # policy that permanently shrinks the compute tier. Restarting is safe: the
    # poison-message guard (frees.compute.drop-redelivered) fails the offending
    # job on redelivery instead of crash-looping the fresh worker.
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=compute
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_REDIS_HOST=redis
      # Headless: consumes from RabbitMQ and writes to Redis, serves no HTTP.
      - SPRING_MAIN_WEB_APPLICATION_TYPE=none
      - OTEL_SDK_DISABLED=true
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  mdf-sidecar:
    image: ghcr.io/ernsoylu/frees-mdf-sidecar:${FREES_VERSION:-latest}
    container_name: frees-mdf-sidecar
    restart: unless-stopped
    # Not published on the host at all: only api-node talks to it, over the
    # compose network.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    image: ghcr.io/ernsoylu/frees-frontend:${FREES_VERSION:-latest}
    container_name: frees-frontend
    restart: unless-stopped
    environment:
      BUILD_COMMIT: ${FREES_VERSION:-latest}
      BACKEND_HOST: api-node
      # Which upstream hops may set the client-address header, and which header
      # carries it. Empty is correct for a local run: with a docker-published
      # port nginx's peer is always the bridge gateway, so trusting it would let
      # any client forge its own address and defeat rate limiting.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-}
    # The only port meant to carry traffic. Defaults to loopback.
    ports:
      - "${FREES_FRONTEND_BIND:-127.0.0.1}:5173:8080"
    depends_on:
      api-node:
        condition: service_healthy
