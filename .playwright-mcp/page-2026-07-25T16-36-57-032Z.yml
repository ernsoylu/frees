                  - generic [ref=e749]: "m = 2 [kg] { mass }"
                  - generic [ref=e750]: "k = 50 [N/m] { stiffness }"
                  - generic [ref=e751]: "c = 4 [N-s/m] { damping }"
                  - generic [ref=e752]: "x0 = 0.1 [m] { initial displacement }"
                  - generic [ref=e754]: "wn = sqrt(k/m) { natural frequency }"
                  - generic [ref=e755]: "zeta = c / (2*sqrt(k*m)) { damping ratio (underdamped < 1) }"
                  - generic [ref=e756]: "wd = wn*sqrt(1 - zeta^2) { damped frequency }"
                  - generic [ref=e758]: time = t * 1 [s]
                  - generic [ref=e759]: "env = x0*exp(-zeta*wn*time) { decay envelope }"
                  - generic [ref=e760]: x = env * (cos(wd*time) + (zeta*wn/wd)*sin(wd*time))
                  - generic [ref=e762]: PARAMETRIC vibration (t, time, x, env)
                  - generic [ref=e763]: t = 0:0.05:6
