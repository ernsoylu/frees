                  - generic [ref=e744]: // Damped Harmonic Oscillator (parametric time sweep)
                  - generic [ref=e745]: "{ Free vibration of a mass-spring-damper, released from x0 at rest,"
                  - generic [ref=e746]: "sampled in time. PARAMETRIC table: open the Tables tab and click"
                  - generic [ref=e747]: "\"Solve Table\" (not the main Solve). Then chart x vs time, adding"
