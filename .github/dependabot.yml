# Automated dependency vulnerability scanning + update PRs.
#
# Added after a manual review found matheclipse-core transitively dragging in a
# jackson-databind with HIGH CVEs (caught by hand, pinned in build.gradle). This
# config makes the next such drift surface automatically as a PR instead of
# waiting for the next manual audit. Grouped so routine bumps land as one PR per
# ecosystem rather than a flood.
version: 2
updates:
  # Backend — both Gradle modules (core, web) are discovered from the root.
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Frontend npm dependencies.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # plugin-react 6.x requires Vite 8 (imports vite/internal, absent in
      # Vite 6) — the legacy-peer-deps .npmrc masks the conflict at install
      # and the toolchain then crashes at config load. Take 6.x together with
      # a deliberate Vite 8 migration, not via a routine bump (PR #52).
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # The other half of that same deferral. Deferring plugin-react but not
      # Vite left the npm job attempting `npm install vite@8` every run, which
      # can't succeed: `overrides.vite` pins ^6.4.3 to hold transitive
      # consumers on the direct version, and npm rejects a direct-dependency
      # bump that leaves its own override behind —
      #   npm error code EOVERRIDE
      #   npm error Override for vite@8.1.5 conflicts with direct dependency
      # The group PR still lands minus Vite, so this only ever showed up as a
      # permanently red Dependabot job rather than a missing update. Lift both
      # entries together with the Vite 8 migration, and bump `overrides.vite`
      # in the same commit as the devDependency.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # typescript-eslint hard-throws on any TypeScript major >= 7 ("does not
      # support TS 7.0", typescript-eslint/dist/index.js), so a routine TS 7
      # bump takes `npm run lint` down with it — and `npm run build` runs
      # `tsc -b`, so TS 7 (the native/Go rewrite) is a deliberate migration to
      # schedule, not a weekly bump. Lift this once typescript-eslint ships TS 7
      # support: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Docker base images (the SUNDIALS/MPI base-pin foot-gun lives here — keep an
  # eye on Temurin base bumps).
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"

  # GitHub Actions used by CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
