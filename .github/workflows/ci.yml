name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs full history: a shallow clone can't resolve the
          # target branch ref ("Could not find ref: main"), which degrades
          # PR new-code detection and blame data.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install SUNDIALS (IDA/DAE native library)
        # ubuntu-24.04 ships MPI-free SUNDIALS v6 — the same SUNContext ABI the
        # JNA binding targets and the Docker base image pins (noble). Without
        # it every IDA-gated test skips, leaving the DAE paths uncovered.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsundials-dev

      - name: Run tests, generate coverage report, and enforce coverage floor
        # Unqualified task names in a Gradle multi-project build run in every
        # subproject that defines them, so this covers both :core and :web.
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-report
          path: |
            backend/core/build/reports/tests/test/
            backend/web/build/reports/tests/test/

  frontend-build:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        # Was Node 20, which went EOL in April 2026 and is below the `>=22` floor
        # that @testing-library/jest-dom 7 and rollup-plugin-visualizer 7 declare.
        # 24 is the active LTS. The suite also passes on 26 (the Dockerfile build
        # stage) — see the Web Storage shim in src/test/setup.ts, which is what
        # makes that true — but CI tracks LTS rather than the current line.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit dependencies (fail on high/critical)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check documentation coverage
        # Regenerates the reference manifest from the backend registries + the
        # component std-lib and fails if any reference page names a symbol that no
        # longer exists, or binds an example id absent from examples.ts — i.e. the
        # docs have drifted from the implementation.
        working-directory: frontend
        run: npm run check-docs

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trivy scans the repo filesystem for known CVEs in locked dependencies:
      # backend/core/gradle.lockfile + backend/web/gradle.lockfile (Java) and
      # frontend/package-lock.json (npm). It
      # uses its own vulnerability DB (GitHub Advisories, OSV, distro feeds) and
      # needs NO API key. Fails the build on any HIGH/CRITICAL with a fix.
      #
      # Run the official Trivy image directly (from AWS public ECR — no auth)
      # rather than the trivy-action, whose install.sh downloads the binary from
      # GitHub Releases and is prone to flaky/rate-limited failures.
      #
      # Anonymous ECR Public pulls are themselves rate-limited and intermittently
      # return `toomanyrequests` — surfacing as Docker exit code 125 (the run
      # never starts), distinct from Trivy's own codes (0 = clean, 1 = a real
      # HIGH/CRITICAL finding). So we retry only on 125 with backoff and pass
      # every other exit code straight through — a transient registry hiccup must
      # never mask, nor be mistaken for, an actual vulnerability.
      - name: Run Trivy filesystem scan (fail on HIGH/CRITICAL)
        run: |
          set +e
          for attempt in 1 2 3 4; do
            docker run --rm -v "${{ github.workspace }}:/repo:ro" \
              public.ecr.aws/aquasecurity/trivy:0.64.1 \
              fs /repo \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress
            code=$?
            if [ "$code" -ne 125 ]; then
              exit "$code"
            fi
            echo "::warning::Trivy image pull failed (docker exit 125, attempt ${attempt}/4); retrying after backoff"
            sleep $((attempt * 20))
          done
          echo "::error::Trivy image pull kept failing (exit 125) after 4 attempts — ECR Public rate limit"
          exit 1

  shell-lint:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # frees.sh is the only supported way to run the stack, and the two
      # docker-entrypoint.d scripts are deployment-critical: 10-real-ip.sh
      # generates the nginx real_ip trust list (get it wrong and client-IP
      # rate limiting silently breaks) and 40-build-info.sh stamps the commit
      # the About dialog reports. None of them are exercised by any test, so
      # static analysis is the only check they get.
      - name: Run shellcheck
        run: |
          docker run --rm -v "${{ github.workspace }}:/mnt:ro" -w /mnt \
            koalaman/shellcheck:stable \
            frees.sh \
            frontend/docker-entrypoint.d/10-real-ip.sh \
            frontend/docker-entrypoint.d/40-build-info.sh

  docker-build:
    name: Build Docker images (PR)
    runs-on: ubuntu-latest
    # PR-only counterpart to docker-publish, which is gated on push-to-main and
    # so never runs on a pull request. Without this, a change to either
    # Dockerfile reaches main with nothing having built it — the frontend npm ci
    # layer and the backend SUNDIALS/MPI guard are both invisible to the other
    # jobs, which build on the runner rather than in the image.
    #
    # Deliberately declares no `needs`: this is fast feedback on the image
    # build, so it runs alongside the test jobs rather than queueing behind
    # them. docker-publish keeps its `needs` — nothing untested gets published.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # cache-from reads the scopes docker-publish writes on main (a PR can read
      # the default branch's cache), but no cache-to: PR cache entries are scoped
      # to the PR ref and would evict main's without ever being reused by it.
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: false
          # Mirrors docker-publish's build-args so the PR builds the same way the
          # published image is built (VITE_ASYNC_API=1 is required for the async
          # solve transport).
          build-args: |
            VITE_ASYNC_API=1
            VITE_COMMIT_HASH=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=frontend

  docker-publish:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frees-backend:latest
            ghcr.io/${{ github.repository_owner }}/frees-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: true
          build-args: |
            VITE_ASYNC_API=1
            VITE_COMMIT_HASH=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/frees-frontend:latest
            ghcr.io/${{ github.repository_owner }}/frees-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
