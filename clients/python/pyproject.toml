[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frees-client"
version = "0.1.0"
description = "Minimal Python client for the frees equation-solving REST API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[tool.setuptools.packages.find]
include = ["frees_client*"]
