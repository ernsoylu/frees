server.port=${PORT:8080}
spring.application.name=frees-backend

# Machine-readable API contract (OpenAPI 3), served under /api so the
# frontend's nginx proxy carries it to the outside — GET /api/openapi.
springdoc.api-docs.path=/api/openapi

# Topology health probe (GET /api/health). The frontend tier can only be
# reached by URL, so supply its internal address per deployment (on Railway:
# http://frees-frontend.railway.internal:8080/). Left blank, the frontend
# component is reported UNKNOWN rather than probed.
frees.health.frontend-url=${FRONTEND_HEALTH_URL:}

# DoS guards on /api (see RequestGuardFilter). Override per deployment.
frees.security.max-body-bytes=1048576
frees.security.rate-limit-requests=120
frees.security.rate-limit-window-seconds=60

# GET /api/health (the topology report) is unauthenticated and fans out to
# Redis, the broker and the frontend, so it gets its own generous limit rather
# than being unmetered — 4/s sustained per client, far above any real monitor's
# poll rate. The report is also cached for a couple of seconds server-side, so
# this bounds request volume while the cache bounds the actual probe work.
# /api/health/live (no dependency checks) stays fully exempt for platform probes.
frees.security.rate-limit-health-requests=240

# Concurrent in-flight requests allowed on the routes that parse and expand the
# document on the request thread (/api/check, /api/solve*). Peak API-node heap
# is this count times the per-parse cost, so this — not the request rate — is
# what bounds memory; excess requests are shed with 503 + Retry-After rather
# than queued. The per-parse cost is bounded separately by the parser's
# equation budget (-Dfrees.parser.max-generated-equations, default 25 000,
# ~48 MB worst case), so the default 8 caps parse memory at roughly 400 MB.
frees.security.max-concurrent-parses=8

# Parametric-table run limits (POST /api/solve/table, see SolveController).
# The solver's 60 s elapsed cap is PER SOLVE and a table runs one solve per row
# — times up to 12 fixed-point passes when parametric accessors are present —
# so the product needs bounding too, or one request can occupy a compute worker
# far longer than the per-solve cap implies. Rows are rejected up front (422,
# before the job is enqueued); the seconds budget is checked between rows and
# passes and fails the job with a clear message.
frees.solver.max-table-rows=5000
frees.solver.max-table-seconds=120

# Topology-detail gate on GET /api/health (see HealthController). When set, the
# per-service breakdown (names, replica counts, queue depth, latency) is only
# returned to callers presenting this value in an X-Health-Token header; every
# other caller still gets the overall status + 200/503 code. Left blank (the
# default, for local dev) the full topology is returned unguarded.
frees.security.health-detail-token=${FREES_HEALTH_DETAIL_TOKEN:}

# Measurement uploads (Data Analyzer, /api/measurements* only): 200 MB cap,
# enforced three ways — Content-Length in RequestGuardFilter, streamed byte
# count in MeasurementStore, and Spring's multipart limits below.
frees.security.max-upload-bytes=209715200
frees.measurements.ttl-minutes=120
frees.measurements.max-files=20
# asammdf sidecar for DZ-compressed .mf4 (empty = in-process mdf4j only).
# On Railway: http://<sidecar-service>.railway.internal:8090 — the client
# re-resolves DNS per request, so redeploys are picked up automatically.
frees.measurements.sidecar-url=${FREES_MEASUREMENTS_SIDECAR_URL:}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ configuration (asynchronous compute architecture).
# The API node publishes ComputeTasks; the compute node consumes them with
# prefetch = 1 for fair dispatch across replicas.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Poison-message guard: a redelivered task means a worker DIED on it (native
# crash / OOM / hard shutdown), since thrown failures are caught and acked. Drop
# it once (mark the job FAILED) so one bad task can't crash-loop the compute tier.
frees.compute.drop-redelivered=${COMPUTE_DROP_REDELIVERED:true}

# OpenTelemetry (Spring Boot native starter, Boot 4+). Spans are created
# in-process and joined across the API->RabbitMQ->compute hops by the manual
# W3C propagation in TraceContextInjector/ComputeTaskListener.
#
# OTLP export is OFF by default to match the prior deployment posture (no
# collector in front of the app):
#   - Tracing: the OTLP span exporter is only auto-configured when an endpoint
#     is set, so it stays dormant until one is supplied.
#   - Metrics: the OTLP meter registry otherwise defaults to localhost:4318 and
#     logs periodic "failed to publish" warnings, so it is disabled here.
# To ship telemetry, set OTLP_METRICS_ENABLED=true and an OTLP endpoint via
# OTLP_TRACES_ENDPOINT / OTEL_EXPORTER_OTLP_ENDPOINT per deployment.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROB:1.0}
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}

