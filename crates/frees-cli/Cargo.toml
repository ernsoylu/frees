[package]
name = "frees-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless frees engine: solve documents and replay the parity corpus."

[dependencies]
frees-core = { workspace = true }
frees = { workspace = true }
serde_json = { workspace = true }

[features]
# Kept for the old `frees-cli --features rustprop-backend` spelling. Since D12
# rustprop is frees-core's default backend, so the CLI has it either way.
rustprop-backend = ["frees-core/rustprop-backend"]
