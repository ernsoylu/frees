[package]
name = "frees"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wasm-bindgen boundary and Web Worker protocol for the frees engine."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Decision D9 (`ARCHITECTURE_AND_REQUIREMENTS.md#11-retained-architectural-decisions`): the browser bundle
# ships rustprop as its ONLY in-bundle property backend. Since D12 that is also
# frees-core's default, so this names the feature rather than opting out of a
# default set that no longer carries anything else. Spelled as a path rather
# than `workspace = true` because `default-features` cannot be overridden on an
# inherited dependency.
frees-core = { path = "../frees-core", default-features = false, features = [
    "rustprop-backend",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

# wasm-pack invokes wasm-opt after cargo; without this it uses its default and
# the module keeps opt-level=3 (speed) sizing from [profile.release]. `-Oz` is
# the size-first setting, which is the right trade for a module the user
# downloads before they can solve anything.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
