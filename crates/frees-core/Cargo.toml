[package]
name = "frees-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The frees equation-solving engine — target-agnostic (native + wasm32)."

[dependencies]
petgraph = { workspace = true }
libm = { workspace = true }
num-bigint = { workspace = true }
num-integer = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true, optional = true }
# The accuracy path (decision D8): rustprop, the pure-Rust CoolProp 8 port, as
# a direct cargo dependency. Its engines and per-fluid data are opt-in Cargo
# features, so this build links exactly the fluids frees serves — nothing
# monolithic. rustprop's shipped crates carry zero external dependencies, which
# is what keeps frees-core clear of wasm-bindgen (the CLAUDE.md hard rule).
# Pinned to a release tag (v0.3.0) rather than a branch: a git dependency on a moving
# ref would let the property backend change under a green parity corpus. Once
# the crates.io names are claimed this becomes a plain version requirement and
# the `git`/`tag` keys come out. Not a path dependency any more, so GitHub CI
# can finally build the wasm/web jobs, which needed a sibling checkout before.
rustprop = { git = "https://github.com/ernsoylu/RustProp", tag = "v0.3.0", features = [
    "heos",
    # The mixture engine; its tables (`mixture-data`) come with
    # `linked-fluids` or are installed at run time (phase E).
    "heos-mixture-engine",
    "humid-air",
    "incompressible",
], optional = true }
# The fluids every build links: the four the documentation and examples lean
# on most, and the two humid air needs (water, air). Every other fluid comes
# with `linked-fluids` or is installed at run time from packed bytes
# (`props::tables::install_from_bytes`, phase E). `ALWAYS_LINKED` in
# `props/tables.rs` names these and must match.
#
# Per-fluid history, kept from when each was linked: CO2 came in Wave G2
# (2026-08-23) for `MolarMass(CarbonDioxide)`; ammonia, nitrogen, methane and
# n_propane on 2026-09-09; the remaining pure fluids the alias table names on
# 2026-09-10, when the budget went 4096 -> 5120; r125 and r227ea with the
# low-GWP blends on 2026-10-19. The ci.yml header carries the measured cost
# of each.
rustprop-data = { git = "https://github.com/ernsoylu/RustProp", tag = "v0.3.0", features = [
    "water",
    "r134a",
    "r1234yf",
    "air",
], optional = true }
# rustprop-core carries the shared parameter types. The warm adapter
# (`props/rustprop_warm.rs`) drives rustprop's LOW-LEVEL `PtFlash` API, and
# `solver_rho_tp_guessed` takes a `params::Phase` that the `rustprop` facade
# does not re-export — using the low-level API means naming its types. Already
# linked transitively by `rustprop`, so this adds nothing to the bundle, and it
# has zero external dependencies like every other shipped rustprop crate.
rustprop-core = { git = "https://github.com/ernsoylu/RustProp", tag = "v0.3.0", optional = true }

[features]
# rustprop is the property backend everywhere — decision D12, which retires the
# `linked-tables` artifacts D1/D7 introduced. It is on by default so that
# `cargo build -p frees-core` has a backend at all; `frees` names it explicitly
# because that crate also sets `default-features = false`.
default = ["rustprop-backend", "linked-fluids"]
serde = ["dep:serde"]

# Install rustprop as the process's RealFluid backend. With it OFF the engine
# has no real-fluid source and property calls return the honest no-backend
# diagnostic — that configuration exists only so the library is proven to
# compile without the optional dependency.
rustprop-backend = ["dep:rustprop", "dep:rustprop-data", "dep:rustprop-core"]

# Link every other fluid the alias table names, and the mixture tables. On by
# default, so native builds, the CLI and the test suites serve them all. The
# browser module (`crates/frees`) leaves it off and installs them on first use
# from the packed files `frees-fluid-pack` writes, which reads this list
# (phase E: lazy fluid chunks).
linked-fluids = [
    "rustprop-backend",
    "rustprop/mixture-data",
    "rustprop-data/carbondioxide",
    "rustprop-data/ammonia",
    "rustprop-data/nitrogen",
    "rustprop-data/methane",
    "rustprop-data/n_propane",
    "rustprop-data/r12",
    "rustprop-data/r22",
    "rustprop-data/r32",
    "rustprop-data/r123",
    "rustprop-data/r245fa",
    "rustprop-data/r404a",
    "rustprop-data/r407c",
    "rustprop-data/r410a",
    "rustprop-data/r1234ze_e_",
    "rustprop-data/argon",
    "rustprop-data/carbonmonoxide",
    "rustprop-data/ethane",
    "rustprop-data/helium",
    "rustprop-data/hydrogen",
    "rustprop-data/isobutane",
    "rustprop-data/n_butane",
    "rustprop-data/oxygen",
    "rustprop-data/r125",
    "rustprop-data/r227ea",
]

[dev-dependencies]
serde_json = { workspace = true }

# Phase 12's fuzzing and benchmark dependencies are dev-only AND native-only:
# proptest pulls rand → getrandom, which refuses wasm32-unknown-unknown, and
# CI clippy compiles --all-targets for that target. The two test/bench targets
# carry matching cfg guards (fuzz_properties.rs is empty on wasm32;
# solve_bench.rs supplies a stub main).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "solve_bench"
harness = false
